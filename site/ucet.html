<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Váš účet na TradeLinku.">
  <meta name="robots" content="noindex">
  <title>Můj účet — TradeLink</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="nav__bar">
      <a class="nav__brand" href="./">TradeLink</a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Otevřít menu">
        <span></span>
      </button>
    </div>
    <nav class="nav__menu" id="nav-menu" aria-label="Hlavní navigace">
      <a href="./">Hlavní stránka</a>
      <a href="recepce.html">Recepce</a>
      <a href="registrace.html">Založit účet</a>
      <a class="is-cta" id="nav-account" href="prihlaseni.html">Přihlásit se</a>
    </nav>
  </header>

  <main class="auth shell">
    <div class="auth__card auth__card--wide">
      <p class="auth__kicker" id="account-type">Účet</p>
      <h1 id="account-name">Můj účet</h1>
      <p class="auth__lead" id="account-lead">Načítám…</p>

      <dl class="detail" id="detail" hidden></dl>

      <p class="form__status" id="status" hidden></p>

      <div class="actions" id="actions" hidden>
        <a class="btn" href="recepce.html">Zpět na recepci</a>
        <button class="btn btn--ghost" type="button" id="signout">Odhlásit se</button>
      </div>
    </div>
  </main>

  <footer class="foot shell">
    <a class="foot__brand" href="./">TradeLink</a>
    <span class="foot__links">
      <a href="podminky.html">Podmínky užití</a>
      <a href="soukromi.html">Ochrana údajů</a>
    </span>
    <small>© 2026 TradeLink</small>
  </footer>

  <script src="supabase-config.js"></script>
  <script src="app.js" defer></script>
  <script type="module">
    import { supabase, ROLES, status, configured, paintNav } from './auth.js';

    var statusEl = document.getElementById('status');

    if (!configured) {
      document.getElementById('account-lead').textContent = '';
      status(statusEl, 'Účty zatím nejsou připojené k databázi. Doplň údaje v supabase-config.js.', 'error');
    } else {
      (async function () {
        var session = await paintNav();
        if (!session) return window.location.replace('prihlaseni.html');

        var user = session.user;
        var meta = user.user_metadata || {};
        var role = ROLES[meta.role];

        document.getElementById('account-type').textContent = role ? role.accountLabel : 'Účet';
        document.getElementById('account-name').textContent =
          meta.company_name || meta.full_name || 'Můj účet';
        document.getElementById('account-lead').textContent =
          'Platforma se teprve staví. Zatím tu máte jen svůj účet — nabídky, poptávky a profily přibudou.';

        var rows = [
          ['E-mail', user.email],
          ['Typ účtu', meta.account_type === 'firma' ? 'Firma nebo živnostník' : 'Osoba'],
          ['Na TradeLink jste přišli jako', role ? role.title : '—']
        ];
        if (meta.company_name) rows.push(['Firma', meta.company_name]);
        if (meta.ico) rows.push(['IČO', meta.ico]);
        if (meta.full_name) rows.push(['Kontaktní osoba', meta.full_name]);

        var detail = document.getElementById('detail');
        detail.innerHTML = rows.map(function (r) {
          return '<div class="detail__row"><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>';
        }).join('');
        detail.hidden = false;
        document.getElementById('actions').hidden = false;
      })();
    }

    document.getElementById('signout').addEventListener('click', async function () {
      await supabase.auth.signOut();
      window.location.assign('./');
    });
  </script>
</body>
</html>
