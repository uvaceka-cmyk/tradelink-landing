<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Obnova hesla k účtu TradeLink.">
  <meta name="robots" content="noindex">
  <title>Obnova hesla — TradeLink</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="nav__bar">
      <a class="nav__brand" href="./">TradeLink</a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Otevřít menu">
        <span></span>
      </button>
    </div>
    <nav class="nav__menu" id="nav-menu" aria-label="Hlavní navigace">
      <a href="./">Hlavní stránka</a>
      <a href="recepce.html">Recepce</a>
      <a href="registrace.html">Založit účet</a>
      <a class="is-cta" id="nav-account" href="prihlaseni.html">Přihlásit se</a>
    </nav>
  </header>

  <main class="auth shell">
    <div class="auth__card">
      <p class="auth__kicker">Obnova hesla</p>
      <h1>Zapomenuté heslo</h1>
      <p class="auth__lead">Zadejte e-mail, kterým se přihlašujete. Pošleme na něj odkaz pro nastavení nového hesla.</p>

      <form class="form" id="form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <p class="form__status" id="status" hidden></p>

        <button class="btn" type="submit">Poslat odkaz</button>
      </form>

      <p class="auth__alt"><a href="prihlaseni.html">Zpět na přihlášení</a></p>
    </div>
  </main>

  <footer class="foot shell">
    <a class="foot__brand" href="./">TradeLink</a>
    <span class="foot__links">
      <a href="faq.html">Časté otázky</a>
      <a href="podminky.html">Podmínky užití</a>
      <a href="soukromi.html">Ochrana údajů</a>
      <a href="zpetna-vazba.html">Zpětná vazba</a>
    </span>
    <small>© 2026 TradeLink</small>
  </footer>

  <script src="supabase-config.js"></script>
  <script src="app.js" defer></script>
  <script src="forms.js" defer></script>
  <script type="module">
    import { supabase, status, busy, requireConfig, czechError, paintNav } from './auth.js';

    paintNav();

    var form = document.getElementById('form');
    var statusEl = document.getElementById('status');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      status(statusEl, '');
      if (!requireConfig(statusEl)) return;

      busy(form, true, 'Odesílám…');

      var { error } = await supabase.auth.resetPasswordForEmail(
        document.getElementById('email').value.trim(),
        { redirectTo: window.location.origin + '/nove-heslo.html' }
      );

      busy(form, false);

      if (error) return status(statusEl, czechError(error), 'error');

      form.hidden = true;
      /* Záměrně neprozrazujeme, jestli účet existuje — nedáváme tak
         nikomu možnost zjistit, kdo je na TradeLinku registrovaný. */
      status(statusEl,
        'Pokud na tento e-mail existuje účet, poslali jsme na něj odkaz pro nastavení nového hesla. Platí hodinu.',
        'ok');
    });
  </script>
</body>
</html>
